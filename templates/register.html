{% extends "base.html" %}

{% block title %} Create an Account {% endblock %}

{% block content %}
<h1>Please enter your details to register with the Book Nook!.</h1>

<form action="#" method="POST">
    <p>Username</p>
    <input type="text" name="regUsername" /> <br>
    <p>Email</p>
    <input type="text" name="regEmail" />
    <p>Password:</p>
    <input type="password" name="regPassword" placeholder="********" /> <br>
    <input type="submit" value="submit" />
</form>

{% endblock %}
