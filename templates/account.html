{% extends "base.html" %}
{% block title %}My Account{% endblock %}

{% block content %}

    <h1>My Account</h1>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
        <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

{% endblock %}
